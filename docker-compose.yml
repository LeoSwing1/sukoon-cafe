services:
  postgres:
    image: postgres:16-alpine
    container_name: sukoon-cafe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sukoon_cafe
      POSTGRES_USER: sukoon
      POSTGRES_PASSWORD: "88588"
    ports:
      - "5433:5432"
    volumes:
      - sukoon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sukoon -d sukoon_cafe"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sukoon_pgdata:
